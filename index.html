<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Slicer - Tallador de Pizza i Truites</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Capa d'interfície */
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px) 16px;
      pointer-events: none;
    }
    .header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-self: center;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Targeta de controls inferior */
    .controls-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }
    .selector-group {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 10px 0;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
    }
    .slice-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-step {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-step:active {
      background: rgba(56, 189, 248, 0.4);
    }
    .slice-display {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .count-badge {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1;
    }
    .count-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-top: 2px;
    }
    #error-msg {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      display: none;
      z-index: 30;
      font-size: 0.85rem;
      text-align: center;
      max-width: 85%;
    }
  </style>
</head>
<body>

<div id="app">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="error-msg"></div>

  <div class="ui-layer">
    <div class="header">
      <h1>Smart Slicer</h1>
    </div>

    <div class="controls-card">
      <div class="selector-group">
        <button class="mode-btn active" onclick="setMode('circle')">Rodona</button>
        <button class="mode-btn" onclick="setMode('square')">Quadrat</button>
      </div>

      <div class="slice-control-row">
        <button class="btn-step" onclick="changeSlices(-1)">−</button>
        <div class="slice-display">
          <span class="count-badge" id="slice-count">8</span>
          <span class="count-label">Porcions</span>
        </div>
        <button class="btn-step" onclick="changeSlices(1)">+</button>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const sliceCountDisplay = document.getElementById('slice-count');
  const errorMsg = document.getElementById('error-msg');

  let currentMode = 'circle';
  let slices = 8;

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  function changeSlices(delta) {
    slices = Math.min(10, Math.max(1, slices + delta));
    sliceCountDisplay.textContent = slices;
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      video.play();
    } catch (err) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = "No s'ha pogut accedir a la càmera. Assegura't de fer servir HTTPS i haver donat permisos al navegador.";
    }
  }

  function drawOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) * 0.65;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 242, 254, 0.5)';
    ctx.shadowBlur = 10;

    // 1. Dibuixar contorn exterior
    ctx.beginPath();
    if (currentMode === 'circle') {
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    } else {
      ctx.rect(centerX - radius, centerY - radius, radius * 2, radius * 2);
    }
    ctx.strokeStyle = '#00f2fe';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.stroke();

    // 2. Dibuixar línies de tall interiors
    if (slices > 1) {
      ctx.setLineDash([]);
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 3;

      if (currentMode === 'circle') {
        // Dibuixar centre
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#ff0055';
        ctx.fill();

        // Talls radials
        const angleStep = (2 * Math.PI) / slices;
        for (let i = 0; i < slices; i++) {
          const angle = i * angleStep - (Math.PI / 2);
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      } else {
        // Talls per a formes quadrades/rectangulars
        const left = centerX - radius;
        const top = centerY - radius;
        const size = radius * 2;

        if (slices === 2) {
          // 2 porcions: Línia central vertical
          ctx.beginPath();
          ctx.moveTo(centerX, top);
          ctx.lineTo(centerX, top + size);
          ctx.stroke();
        } else if (slices === 3) {
          // 3 porcions: 2 línies verticals
          const step = size / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * step, top);
            ctx.lineTo(left + i * step, top + size);
            ctx.stroke();
          }
        } else if (slices === 4) {
          // 4 porcions: Creu (2x2)
          ctx.beginPath();
          ctx.moveTo(centerX, top);
          ctx.lineTo(centerX, top + size);
          ctx.moveTo(left, centerY);
          ctx.lineTo(left + size, centerY);
          ctx.stroke();
        } else if (slices === 6) {
          // 6 porcions: Reixeta (3x2)
          const stepX = size / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * stepX, top);
            ctx.lineTo(left + i * stepX, top + size);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(left, centerY);
          ctx.lineTo(left + size, centerY);
          ctx.stroke();
        } else if (slices === 8) {
          // 8 porcions: Reixeta (4x2)
          const stepX = size / 4;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * stepX, top);
            ctx.lineTo(left + i * stepX, top + size);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(left, centerY);
          ctx.lineTo(left + size, centerY);
          ctx.stroke();
        } else if (slices === 9) {
          // 9 porcions: Reixeta (3x3)
          const step = size / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * step, top);
            ctx.lineTo(left + i * step, top + size);
            ctx.moveTo(left, top + i * step);
            ctx.lineTo(left + size, top + i * step);
            ctx.stroke();
          }
        } else if (slices === 10) {
          // 10 porcions: Reixeta (5x2)
          const stepX = size / 5;
          for (let i = 1; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * stepX, top);
            ctx.lineTo(left + i * stepX, top + size);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(left, centerY);
          ctx.lineTo(left + size, centerY);
          ctx.stroke();
        } else {
          // Tirades verticals regulars per a números prims o no estàndard (ex: 5, 7)
          const step = size / slices;
          for (let i = 1; i < slices; i++) {
            ctx.beginPath();
            ctx.moveTo(left + i * step, top);
            ctx.lineTo(left + i * step, top + size);
            ctx.stroke();
          }
        }
      }
    }

    ctx.restore();
    requestAnimationFrame(drawOverlay);
  }

  startCamera();
  drawOverlay();
</script>

</body>
</html>
