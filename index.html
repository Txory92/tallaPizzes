<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Slicer Ultra</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: clamp(12px, 2vh, 20px);
      pointer-events: none;
    }
    
    /* Header Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      pointer-events: auto;
    }
    .brand {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand h1 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .angle-badge {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      color: #94a3b8;
    }
    
    .top-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.active {
      background: #ef4444;
      border-color: #f87171;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    /* Panell Inferior Prim (Optimitzat per Desktop i Mòbil) */
    .controls-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Modus de tall */
    .selector-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.3);
    }

    /* Contador de Porcions */
    .slice-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 3px 8px;
      border-radius: 99px;
    }
    .btn-step {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-step:active { background: rgba(56, 189, 248, 0.3); }
    .count-badge {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      min-width: 24px;
      text-align: center;
    }

    /* Eines secundàries (Color i Rotació) */
    .tools-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .color-picker {
      display: flex;
      gap: 6px;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-dot.active {
      border-color: #fff;
      transform: scale(1.2);
    }
    .rotation-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .rotation-control input {
      width: 70px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    #error-msg {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 8px 16px;
      border-radius: 12px;
      display: none;
      z-index: 30;
      font-size: 0.8rem;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .controls-card {
        justify-content: center;
        gap: 8px;
        padding: 12px;
      }
      .tools-wrapper {
        width: 100%;
        justify-content: space-between;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 8px;
        margin-top: 2px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="error-msg"></div>

  <div class="ui-layer">
    <div class="top-bar">
      <div class="brand">
        <h1>Smart Slicer</h1>
        <span class="angle-badge" id="angle-info">45°/porció</span>
      </div>
      <div class="top-actions">
        <button id="torch-btn" class="action-btn" onclick="toggleTorch()" style="display:none;">💡</button>
        <button id="freeze-btn" class="action-btn" onclick="toggleFreeze()">📷 Congelar</button>
      </div>
    </div>

    <div class="controls-card">
      <div class="selector-group">
        <button class="mode-btn active" onclick="setMode('circle', this)">Rodona</button>
        <button class="mode-btn" onclick="setMode('square', this)">Quadrat</button>
        <button class="mode-btn" onclick="setMode('rect', this)">Rectangle</button>
      </div>

      <div class="slice-control">
        <button class="btn-step" onclick="changeSlices(-1)">−</button>
        <span class="count-badge" id="slice-count">8</span>
        <button class="btn-step" onclick="changeSlices(1)">+</button>
      </div>

      <div class="tools-wrapper">
        <div class="color-picker">
          <div class="color-dot active" style="background: #00f2fe;" onclick="setColor('#00f2fe', this)"></div>
          <div class="color-dot" style="background: #00ff66;" onclick="setColor('#00ff66', this)"></div>
          <div class="color-dot" style="background: #ff0055;" onclick="setColor('#ff0055', this)"></div>
          <div class="color-dot" style="background: #ffea00;" onclick="setColor('#ffea00', this)"></div>
        </div>

        <div class="rotation-control">
          <span>Gira</span>
          <input type="range" id="rotation" min="0" max="360" value="0" oninput="drawOverlay()">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const sliceCountDisplay = document.getElementById('slice-count');
  const angleInfo = document.getElementById('angle-info');
  const errorMsg = document.getElementById('error-msg');
  const freezeBtn = document.getElementById('freeze-btn');
  const torchBtn = document.getElementById('torch-btn');
  const rotationInput = document.getElementById('rotation');

  let currentMode = 'circle';
  let slices = 8;
  let lineColor = '#00f2fe';
  let isFrozen = false;
  let frozenCanvas = null;
  let videoTrack = null;
  let animationFrameId = null;

  let guide = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    radius: Math.min(window.innerWidth, window.innerHeight) * 0.28,
    aspectRatio: 1.4
  };

  let touchState = {
    isDragging: false,
    startX: 0, startY: 0,
    initialGuideX: 0, initialGuideY: 0,
    initialPinchDist: 0, initialRadius: 0
  };

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(12);
  }

  function updateAngleInfo() {
    if (currentMode === 'circle') {
      const angle = (360 / slices).toFixed(1);
      angleInfo.textContent = `${angle}°/porció`;
    } else {
      angleInfo.textContent = `${slices} porcions`;
    }
  }

  function setMode(mode, el) {
    vibrate();
    currentMode = mode;
    document.querySelectorAll('.selector-group .mode-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    updateAngleInfo();
    drawOverlay();
  }

  function changeSlices(delta) {
    vibrate();
    slices = Math.min(12, Math.max(1, slices + delta));
    sliceCountDisplay.textContent = slices;
    updateAngleInfo();
    drawOverlay();
  }

  function setColor(color, el) {
    vibrate();
    lineColor = color;
    document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
    el.classList.add('active');
    drawOverlay();
  }

  async function toggleFreeze() {
    vibrate();
    isFrozen = !isFrozen;

    if (isFrozen) {
      freezeBtn.classList.add('active');
      freezeBtn.innerHTML = '▶ Descongelar';
      
      frozenCanvas = document.createElement('canvas');
      frozenCanvas.width = canvas.width;
      frozenCanvas.height = canvas.height;
      const fCtx = frozenCanvas.getContext('2d');
      fCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
      video.pause();
    } else {
      freezeBtn.classList.remove('active');
      freezeBtn.innerHTML = '📷 Congelar';
      await video.play();
      frozenCanvas = null;
      startLoop();
    }
    drawOverlay();
  }

  async function toggleTorch() {
    if (videoTrack) {
      vibrate();
      const capabilities = videoTrack.getCapabilities();
      if (capabilities.torch) {
        const settings = videoTrack.getSettings();
        await videoTrack.applyConstraints({
          advanced: [{ torch: !settings.torch }]
        });
      }
    }
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (!touchState.isDragging) {
      guide.x = canvas.width / 2;
      guide.y = canvas.height / 2;
    }
    drawOverlay();
  }
  window.addEventListener('resize', resizeCanvas);

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
      
      const capabilities = videoTrack.getCapabilities?.();
      if (capabilities && capabilities.torch) {
        torchBtn.style.display = 'flex';
      }

      await video.play();
      startLoop();
    } catch (err) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = "Accés a la càmera denegat o no disponible.";
    }
  }

  // Touch Events
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchState.isDragging = true;
      touchState.startX = e.touches[0].clientX;
      touchState.startY = e.touches[0].clientY;
      touchState.initialGuideX = guide.x;
      touchState.initialGuideY = guide.y;
    } else if (e.touches.length === 2) {
      touchState.isDragging = false;
      touchState.initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      touchState.initialRadius = guide.radius;
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    if (touchState.isDragging && e.touches.length === 1) {
      guide.x = touchState.initialGuideX + (e.touches[0].clientX - touchState.startX);
      guide.y = touchState.initialGuideY + (e.touches[0].clientY - touchState.startY);
      drawOverlay();
    } else if (e.touches.length === 2) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = currentDist / touchState.initialPinchDist;
      guide.radius = Math.max(30, Math.min(canvas.width * 0.8, touchState.initialRadius * factor));
      drawOverlay();
    }
  });

  canvas.addEventListener('touchend', () => { touchState.isDragging = false; });

  // Render Loop
  function startLoop() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function loop() {
      if (!isFrozen) {
        drawOverlay();
        animationFrameId = requestAnimationFrame(loop);
      }
    }
    loop();
  }

  function drawOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isFrozen && frozenCanvas) {
      ctx.drawImage(frozenCanvas, 0, 0);
    }

    const rotationRad = (parseInt(rotationInput.value, 10) * Math.PI) / 180;
    const r = guide.radius;

    ctx.save();
    ctx.translate(guide.x, guide.y);
    ctx.rotate(rotationRad);

    ctx.shadowColor = lineColor;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = lineColor;
    ctx.fillStyle = lineColor;
    ctx.lineWidth = 2.5;

    // Outer boundary
    ctx.beginPath();
    if (currentMode === 'circle') {
      ctx.arc(0, 0, r, 0, 2 * Math.PI);
    } else if (currentMode === 'square') {
      ctx.rect(-r, -r, r * 2, r * 2);
    } else if (currentMode === 'rect') {
      const w = r * guide.aspectRatio;
      ctx.rect(-w, -r, w * 2, r * 2);
    }
    ctx.setLineDash([6, 6]);
    ctx.stroke();

    // Slices
    if (slices > 1) {
      ctx.setLineDash([]);

      if (currentMode === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, 2 * Math.PI);
        ctx.fill();

        const angleStep = (2 * Math.PI) / slices;
        for (let i = 0; i < slices; i++) {
          const angle = i * angleStep - (Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
          ctx.stroke();
        }
      } else {
        const width = currentMode === 'rect' ? r * guide.aspectRatio : r;
        const left = -width;
        const top = -r;
        const wTotal = width * 2;
        const hTotal = r * 2;

        if (slices === 2) {
          ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(0, top + hTotal); ctx.stroke();
        } else if (slices === 3) {
          const step = wTotal / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath(); ctx.moveTo(left + i * step, top); ctx.lineTo(left + i * step, top + hTotal); ctx.stroke();
          }
        } else if (slices === 4) {
          ctx.beginPath();
          ctx.moveTo(0, top); ctx.lineTo(0, top + hTotal);
          ctx.moveTo(left, 0); ctx.lineTo(left + wTotal, 0);
          ctx.stroke();
        } else if (slices === 6) {
          const stepX = wTotal / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath(); ctx.moveTo(left + i * stepX, top); ctx.lineTo(left + i * stepX, top + hTotal); ctx.stroke();
          }
          ctx.beginPath(); ctx.moveTo(left, 0); ctx.lineTo(left + wTotal, 0); ctx.stroke();
        } else if (slices === 8) {
          const stepX = wTotal / 4;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath(); ctx.moveTo(left + i * stepX, top); ctx.lineTo(left + i * stepX, top + hTotal); ctx.stroke();
          }
          ctx.beginPath(); ctx.moveTo(left, 0); ctx.lineTo(left + wTotal, 0); ctx.stroke();
        } else if (slices === 9) {
          const stepX = wTotal / 3;
          const stepY = hTotal / 3;
          for (let i = 1; i < 3; i++) {
            ctx.beginPath(); ctx.moveTo(left + i * stepX, top); ctx.lineTo(left + i * stepX, top + hTotal); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(left, top + i * stepY); ctx.lineTo(left + wTotal, top + i * stepY); ctx.stroke();
          }
        } else {
          const step = wTotal / slices;
          for (let i = 1; i < slices; i++) {
            ctx.beginPath(); ctx.moveTo(left + i * step, top); ctx.lineTo(left + i * step, top + hTotal); ctx.stroke();
          }
        }
      }
    }

    ctx.restore();
  }

  resizeCanvas();
  startCamera();
  updateAngleInfo();
</script>

</body>
</html>
