<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Slicer - Tallador de Pizza i Truites</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px) 16px;
      pointer-events: none;
    }
    .header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-self: center;
      text-align: center;
      pointer-events: auto;
    }
    .header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
      display: block;
    }
    .controls-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .selector-group {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 11px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }
    .count-badge {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

<div id="app">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1>Smart Slicer</h1>
      <span id="status" class="status-badge">Iniciant...</span>
    </div>

    <div class="controls-card">
      <div class="selector-group">
        <button class="mode-btn active" onclick="setMode('auto')">Auto</button>
        <button class="mode-btn" onclick="setMode('circle')">Cercle</button>
        <button class="mode-btn" onclick="setMode('square')">Quadrat</button>
      </div>

      <div class="slider-row">
        <span class="label">Talls</span>
        <div class="slider-container">
          <input type="range" id="slices" min="1" max="10" value="8">
        </div>
        <div class="count-badge" id="slice-count">8</div>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slices');
  const sliceCountDisplay = document.getElementById('slice-count');
  const statusBadge = document.getElementById('status');

  // Canvas amagat molt petit per analitzar la imatge sense carregar la CPU
  const cvCanvas = document.createElement('canvas');
  cvCanvas.width = 160;
  cvCanvas.height = 160;
  const cvCtx = cvCanvas.getContext('2d');

  let currentMode = 'auto';
  let isOpenCvReady = false;
  let isProcessingFrame = false;

  let targetShape = { x: 0, y: 0, radius: 0, type: 'circle', detected: false };

  function onOpenCvReady() {
    isOpenCvReady = true;
    statusBadge.textContent = "Auto-detecció activa (Fluida)";
    // Iniciar bucle d'anàlisi lent (cada 300ms = ~3 cops per segon)
    setInterval(detectObjectFast, 300);
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (mode !== 'auto') {
      statusBadge.textContent = `Manual (${mode === 'circle' ? 'Cercle' : 'Quadrat'})`;
    } else {
      statusBadge.textContent = isOpenCvReady ? "Auto-detecció activa" : "Carregant IA...";
    }
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      video.play();
    } catch (err) {
      statusBadge.textContent = "Error de càmera";
    }
  }

  // Algoritme d'anàlisi ultra-lleuger executat només 3 cops per segon
  function detectObjectFast() {
    if (!isOpenCvReady || currentMode !== 'auto' || video.readyState !== 4 || isProcessingFrame) return;

    isProcessingFrame = true;

    try {
      cvCtx.drawImage(video, 0, 0, cvCanvas.width, cvCanvas.height);
      let src = cv.imread(cvCanvas);
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, gray, new cv.Size(3, 3), 0);

      let circles = new cv.Mat();
      // Paràmetres ajustats per a 160px de resolució
      cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 30, 60, 25, 15, 75);

      if (circles.cols > 0) {
        const scaleX = canvas.width / cvCanvas.width;
        const scaleY = canvas.height / cvCanvas.height;

        const rawX = circles.data32F[0] * scaleX;
        const rawY = circles.data32F[1] * scaleY;
        const rawR = circles.data32F[2] * Math.min(scaleX, scaleY);

        if (!targetShape.detected) {
          targetShape.x = rawX;
          targetShape.y = rawY;
          targetShape.radius = rawR;
          targetShape.detected = true;
        } else {
          // Objectiu cap a les noves coordenades
          targetShape.targetX = rawX;
          targetShape.targetY = rawY;
          targetShape.targetR = rawR;
        }
      }

      src.delete(); gray.delete(); circles.delete();
    } catch (e) {
      // Ignorar errors de memòria de marcadors
    }

    isProcessingFrame = false;
  }

  // Dibuix a la pantalla (60 FPS super fluids)
  function drawOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const numSlices = parseInt(slider.value, 10);
    sliceCountDisplay.textContent = numSlices;

    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let radius = Math.min(centerX, centerY) * 0.6;
    let shapeType = currentMode === 'square' ? 'square' : 'circle';

    // Suavitzar la transició de les coordenades en cada fotograma
    if (currentMode === 'auto' && targetShape.detected) {
      if (targetShape.targetX) {
        targetShape.x += (targetShape.targetX - targetShape.x) * 0.1;
        targetShape.y += (targetShape.targetY - targetShape.y) * 0.1;
        targetShape.radius += (targetShape.targetR - targetShape.radius) * 0.1;
      }
      centerX = targetShape.x;
      centerY = targetShape.y;
      radius = targetShape.radius;
      shapeType = 'circle';
    }

    // Dibuixar la guia
    ctx.save();
    ctx.beginPath();
    if (shapeType === 'circle') {
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    } else {
      ctx.rect(centerX - radius, centerY - radius, radius * 2, radius * 2);
    }
    ctx.strokeStyle = '#00f2fe';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.stroke();

    // Centre
    ctx.beginPath();
    ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff0055';
    ctx.fill();

    // Línies de tall
    if (numSlices > 1) {
      ctx.setLineDash([]);
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 2.5;

      if (shapeType === 'circle') {
        const angleStep = (2 * Math.PI) / numSlices;
        for (let i = 0; i < numSlices; i++) {
          const angle = i * angleStep - (Math.PI / 2);
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      } else {
        const cols = Math.ceil(Math.sqrt(numSlices));
        const step = (radius * 2) / cols;
        for (let i = 1; i < cols; i++) {
          ctx.beginPath();
          ctx.moveTo(centerX - radius + i * step, centerY - radius);
          ctx.lineTo(centerX - radius + i * step, centerY + radius);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(centerX - radius, centerY - radius + i * step);
          ctx.lineTo(centerX + radius, centerY - radius + i * step);
          ctx.stroke();
        }
      }
    }

    ctx.restore();
    requestAnimationFrame(drawOverlay);
  }

  slider.addEventListener('input', () => {
    sliceCountDisplay.textContent = slider.value;
  });

  startCamera();
  drawOverlay();
</script>

</body>
</html>
