<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart Slicer Ultra</title>

  <!-- PWA Manifest Inline -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Smart Slicer Ultra","short_name":"Slicer","start_url":".","display":"standalone","background_color":"#090d16","theme_color":"#090d16","icons":[{"src":"https://fav.farm/🍕","sizes":"512x512","type":"image/png"}]}'>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Interfície UI */
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px) 12px;
      pointer-events: none;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .ui-layer.idle {
      opacity: 0;
    }
    
    /* Header Superior Adaptatiu */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      gap: 8px;
    }

    .brand-pill {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
      shrink: 0;
      pointer-events: auto;
      white-space: nowrap;
    }
    .brand-pill h1 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #ff0055, #ff6699);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .angle-badge {
      font-size: 0.68rem;
      color: #cbd5e1;
      font-weight: 600;
    }
    
    .top-actions {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
      pointer-events: auto;
      padding: 2px 0;
    }
    .top-actions::-webkit-scrollbar {
      display: none;
    }

    .action-btn {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.active {
      background: #ff0055;
      border-color: #ff6699;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    /* Panell Inferior Principal */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      pointer-events: auto;
    }

    .sub-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      font-size: 0.72rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sub-bar label {
      color: #94a3b8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sub-bar select, .sub-bar input[type="number"], .sub-bar input[type="range"] {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.72rem;
      outline: none;
    }

    .controls-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .selector-group {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #ff0055;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(255, 0, 85, 0.4);
    }

    .slice-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 99px;
    }
    .btn-step {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-step:active { background: rgba(255, 0, 85, 0.4); }
    .count-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ff0055;
      min-width: 18px;
      text-align: center;
    }

    .tools-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-picker {
      display: flex;
      gap: 5px;
    }
    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-dot.active {
      border-color: #fff;
      transform: scale(1.15);
    }
    .rotation-control {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .rotation-control input {
      width: 50px;
      accent-color: #ff0055;
      cursor: pointer;
    }

    #error-msg {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 6px 14px;
      border-radius: 10px;
      display: none;
      z-index: 30;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      .controls-card {
        justify-content: center;
        gap: 6px;
        padding: 8px;
      }
      .tools-wrapper {
        width: 100%;
        justify-content: space-between;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 6px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="error-msg"></div>

  <div class="ui-layer" id="ui-layer">
    <!-- Header Superior -->
    <div class="top-bar">
      <div class="brand-pill">
        <h1>Slicer</h1>
        <span class="angle-badge" id="angle-info">45°</span>
      </div>
      <div class="top-actions">
        <button id="show-degrees-btn" class="action-btn" onclick="toggleDegrees()">º Graus</button>
        <button id="hole-btn" class="action-btn" onclick="toggleHole()">🍩 Forat</button>
        <button id="unequal-btn" class="action-btn" onclick="toggleUnequal()">📐 Asimètric</button>
        <button id="torch-btn" class="action-btn" onclick="toggleTorch()" style="display:none;">💡</button>
        <button id="freeze-btn" class="action-btn" onclick="toggleFreeze()">📷 Congelar</button>
      </div>
    </div>

    <!-- Contenidor Inferior -->
    <div class="controls-container">
      
      <!-- Sub-barra per al Mode Donut / Forat -->
      <div class="sub-bar" id="subbar-hole" style="display:none;">
        <label>
          Forat interior:
          <input type="range" id="inner-radius-input" min="0.1" max="0.7" step="0.05" value="0.3" oninput="drawOverlay()">
        </label>
      </div>

      <!-- Sub-barra per al Mode Asimètric -->
      <div class="sub-bar" id="subbar-unequal" style="display:none;">
        <label>
          Porció Gran:
          <input type="range" id="vip-slice-input" min="15" max="50" step="5" value="30" oninput="updateAngleInfo(); drawOverlay();">
          <span id="vip-percent-label" style="color:#ff0055; font-weight:bold;">30%</span>
        </label>
      </div>

      <!-- Sub-barra per al Mode Rectangle (Proporcions) -->
      <div class="sub-bar" id="subbar-rect" style="display:none;">
        <label>Proporció:
          <select id="aspect-ratio-select" onchange="updateAspectRatio()">
            <option value="1.333">4:3 (Pa/Llauna)</option>
            <option value="1.777">16:9 (Llarg)</option>
            <option value="2.0">2:1 (Bandeja)</option>
            <option value="1.0">1:1 (Quadrat)</option>
          </select>
        </label>
      </div>

      <!-- Sub-barra per al Mode Grid -->
      <div class="sub-bar" id="subbar-grid" style="display:none;">
        <label>Files:
          <input type="number" id="grid-rows" min="1" max="10" value="3" style="width:40px;" onchange="drawOverlay()">
        </label>
        <label>Cols:
          <input type="number" id="grid-cols" min="1" max="10" value="4" style="width:40px;" onchange="drawOverlay()">
        </label>
      </div>

      <!-- Controls Principals -->
      <div class="controls-card">
        <div class="selector-group">
          <button class="mode-btn active" onclick="setMode('circle', this)">Rodona</button>
          <button class="mode-btn" onclick="setMode('rect', this)">Rect.</button>
          <button class="mode-btn" onclick="setMode('grid', this)">Grid</button>
        </div>

        <div class="slice-control" id="slice-counter-wrapper">
          <button class="btn-step" onclick="changeSlices(-1)">−</button>
          <span class="count-badge" id="slice-count">8</span>
          <button class="btn-step" onclick="changeSlices(1)">+</button>
        </div>

        <div class="tools-wrapper">
          <div class="color-picker">
            <div class="color-dot active" style="background: #ff0055;" onclick="setColor('#ff0055', this)"></div>
            <div class="color-dot" style="background: #00f2fe;" onclick="setColor('#00f2fe', this)"></div>
            <div class="color-dot" style="background: #00ff66;" onclick="setColor('#00ff66', this)"></div>
            <div class="color-dot" style="background: #ffea00;" onclick="setColor('#ffea00', this)"></div>
          </div>

          <div class="rotation-control">
            <span>Gira</span>
            <input type="range" id="rotation" min="0" max="360" value="0" oninput="drawOverlay()">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const uiLayer = document.getElementById('ui-layer');
  const sliceCountDisplay = document.getElementById('slice-count');
  const angleInfo = document.getElementById('angle-info');
  const errorMsg = document.getElementById('error-msg');
  const freezeBtn = document.getElementById('freeze-btn');
  const torchBtn = document.getElementById('torch-btn');
  const holeBtn = document.getElementById('hole-btn');
  const unequalBtn = document.getElementById('unequal-btn');
  const showDegreesBtn = document.getElementById('show-degrees-btn');
  const rotationInput = document.getElementById('rotation');

  let currentMode = 'circle';
  let slices = 8;
  let lineColor = '#ff0055';
  let isFrozen = false;
  let hasHole = false;
  let isUnequal = false;
  let showDegrees = false; // Per defecte DESACTIVAT
  let frozenCanvas = null;
  let videoTrack = null;
  let animationFrameId = null;
  let lastTapTime = 0;
  let idleTimer = null;

  let guide = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    radius: Math.min(window.innerWidth, window.innerHeight) * 0.28,
    aspectRatio: 1.333
  };

  let touchState = {
    isDragging: false,
    startX: 0, startY: 0,
    initialGuideX: 0, initialGuideY: 0,
    initialPinchDist: 0, initialRadius: 0
  };

  // --- SERVICE WORKER PWA ---
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'slicer-v2';
      self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  // --- AUTO-HIDE INTERFÍCIE ---
  function resetIdleTimer() {
    uiLayer.classList.remove('idle');
    clearTimeout(idleTimer);
    if (!isFrozen) {
      idleTimer = setTimeout(() => {
        uiLayer.classList.add('idle');
      }, 3500);
    }
  }

  ['touchstart', 'mousemove', 'click', 'input'].forEach(evt => {
    window.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(12);
  }

  function toggleDegrees() {
    vibrate();
    showDegrees = !showDegrees;
    showDegreesBtn.classList.toggle('active', showDegrees);
    drawOverlay();
  }

  function toggleHole() {
    vibrate();
    hasHole = !hasHole;
    holeBtn.classList.toggle('active', hasHole);
    document.getElementById('subbar-hole').style.display = hasHole ? 'flex' : 'none';
    drawOverlay();
  }

  function toggleUnequal() {
    vibrate();
    isUnequal = !isUnequal;
    unequalBtn.classList.toggle('active', isUnequal);
    document.getElementById('subbar-unequal').style.display = isUnequal ? 'flex' : 'none';
    updateAngleInfo();
    drawOverlay();
  }

  function updateAspectRatio() {
    guide.aspectRatio = parseFloat(document.getElementById('aspect-ratio-select').value);
    drawOverlay();
  }

  function updateAngleInfo() {
    if (currentMode === 'grid') {
      const rows = parseInt(document.getElementById('grid-rows').value, 10) || 1;
      const cols = parseInt(document.getElementById('grid-cols').value, 10) || 1;
      angleInfo.textContent = `${rows}x${cols} (${rows * cols})`;
      return;
    }

    if (isUnequal && currentMode === 'circle') {
      const vipPct = parseInt(document.getElementById('vip-slice-input').value, 10);
      document.getElementById('vip-percent-label').textContent = `${vipPct}%`;
      const remainingPct = ((100 - vipPct) / (slices - 1)).toFixed(1);
      angleInfo.textContent = `1x${vipPct}% + ${slices - 1}x${remainingPct}%`;
      return;
    }

    const pct = (100 / slices).toFixed(1);
    if (currentMode === 'circle') {
      const angle = (360 / slices).toFixed(1);
      angleInfo.textContent = `${angle}° (${pct}%)`;
    } else {
      angleInfo.textContent = `${slices} p. (${pct}%)`;
    }
  }

  function setMode(mode, el) {
    vibrate();
    currentMode = mode;
    document.querySelectorAll('.selector-group .mode-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    document.getElementById('subbar-rect').style.display = mode === 'rect' ? 'flex' : 'none';
    document.getElementById('subbar-grid').style.display = mode === 'grid' ? 'flex' : 'none';
    document.getElementById('slice-counter-wrapper').style.display = mode === 'grid' ? 'none' : 'flex';

    updateAngleInfo();
    drawOverlay();
  }

  function changeSlices(delta) {
    vibrate();
    slices = Math.min(16, Math.max(1, slices + delta));
    sliceCountDisplay.textContent = slices;
    updateAngleInfo();
    drawOverlay();
  }

  function setColor(color, el) {
    vibrate();
    lineColor = color;
    document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
    el.classList.add('active');
    
    document.querySelectorAll('.mode-btn.active').forEach(b => b.style.background = color);
    sliceCountDisplay.style.color = color;
    rotationInput.style.accentColor = color;

    drawOverlay();
  }

  async function toggleFreeze() {
    vibrate();
    isFrozen = !isFrozen;

    if (isFrozen) {
      freezeBtn.classList.add('active');
      freezeBtn.innerHTML = '▶ Actiu';
      
      frozenCanvas = document.createElement('canvas');
      frozenCanvas.width = canvas.width;
      frozenCanvas.height = canvas.height;
      const fCtx = frozenCanvas.getContext('2d');
      fCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
      video.pause();
      clearTimeout(idleTimer);
      uiLayer.classList.remove('idle');
    } else {
      freezeBtn.classList.remove('active');
      freezeBtn.innerHTML = '📷 Congelar';
      await video.play();
      frozenCanvas = null;
      startLoop();
      resetIdleTimer();
    }
    drawOverlay();
  }

  async function toggleTorch() {
    if (videoTrack) {
      vibrate();
      const capabilities = videoTrack.getCapabilities();
      if (capabilities.torch) {
        const settings = videoTrack.getSettings();
        await videoTrack.applyConstraints({ advanced: [{ torch: !settings.torch }] });
      }
    }
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Mantenir la guia sempre dins dels marges visibles
    guide.radius = Math.max(40, Math.min(Math.min(canvas.width, canvas.height) * 0.4, guide.radius));
    guide.x = Math.max(guide.radius, Math.min(canvas.width - guide.radius, guide.x));
    guide.y = Math.max(guide.radius, Math.min(canvas.height - guide.radius, guide.y));

    drawOverlay();
  }
  window.addEventListener('resize', resizeCanvas);

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
      
      const capabilities = videoTrack.getCapabilities?.();
      if (capabilities && capabilities.torch) torchBtn.style.display = 'flex';

      await video.play();
      startLoop();
      resetIdleTimer();
    } catch (err) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = "Accés a la càmera denegat o no disponible.";
    }
  }

  // Interacció Tàctil Segura (Fix del Zoom bug)
  canvas.addEventListener('touchstart', (e) => {
    const now = Date.now();
    if (now - lastTapTime < 300) {
      guide.x = canvas.width / 2;
      guide.y = canvas.height / 2;
      vibrate();
      drawOverlay();
      return;
    }
    lastTapTime = now;

    if (e.touches.length === 1) {
      touchState.isDragging = true;
      touchState.startX = e.touches[0].clientX;
      touchState.startY = e.touches[0].clientY;
      touchState.initialGuideX = guide.x;
      touchState.initialGuideY = guide.y;
    } else if (e.touches.length === 2) {
      touchState.isDragging = false;
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      touchState.initialPinchDist = dist > 0 ? dist : 1;
      touchState.initialRadius = guide.radius;
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    if (touchState.isDragging && e.touches.length === 1) {
      let nextX = touchState.initialGuideX + (e.touches[0].clientX - touchState.startX);
      let nextY = touchState.initialGuideY + (e.touches[0].clientY - touchState.startY);

      // Limitar per no sortir de la pantalla
      const margin = 20;
      guide.x = Math.max(margin, Math.min(canvas.width - margin, nextX));
      guide.y = Math.max(margin, Math.min(canvas.height - margin, nextY));

      drawOverlay();
    } else if (e.touches.length === 2) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );

      if (touchState.initialPinchDist > 0) {
        const factor = currentDist / touchState.initialPinchDist;
        const minAllowed = 40; // Ràdi mínim absolut
        const maxAllowed = Math.min(canvas.width, canvas.height) * 0.45; // Radi màxim absolut

        guide.radius = Math.max(minAllowed, Math.min(maxAllowed, touchState.initialRadius * factor));
        drawOverlay();
      }
    }
  });

  canvas.addEventListener('touchend', () => { touchState.isDragging = false; });

  function startLoop() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function loop() {
      if (!isFrozen) {
        drawOverlay();
        animationFrameId = requestAnimationFrame(loop);
      }
    }
    loop();
  }

  // --- DIBUIX DE LA GUIA I OVERLAY ---
  function drawOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isFrozen && frozenCanvas) {
      ctx.drawImage(frozenCanvas, 0, 0);
    }

    const rotationRad = (parseInt(rotationInput.value, 10) * Math.PI) / 180;
    const r = Math.max(30, guide.radius); // Seguretat addicional per no dibuixar r<=0
    const innerRRatio = parseFloat(document.getElementById('inner-radius-input').value);
    const innerR = r * innerRRatio;

    ctx.save();
    ctx.translate(guide.x, guide.y);
    ctx.rotate(rotationRad);

    ctx.shadowColor = lineColor;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = lineColor;
    ctx.fillStyle = lineColor;
    ctx.lineWidth = 2.5;

    // Outer Boundary
    ctx.beginPath();
    if (currentMode === 'circle') {
      ctx.arc(0, 0, r, 0, 2 * Math.PI);
    } else if (currentMode === 'rect' || currentMode === 'grid') {
      const w = r * guide.aspectRatio;
      ctx.rect(-w, -r, w * 2, r * 2);
    }
    ctx.setLineDash([6, 6]);
    ctx.stroke();

    // Inner Hole (Mode Donut)
    if (hasHole && currentMode === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, innerR, 0, 2 * Math.PI);
      ctx.stroke();
    }

    ctx.setLineDash([]);

    // Dibuix de Talls
    if (currentMode === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, hasHole ? 3 : 4, 0, 2 * Math.PI);
      ctx.fill();

      let currentAngle = -Math.PI / 2;

      if (isUnequal && slices > 1) {
        const vipPct = parseInt(document.getElementById('vip-slice-input').value, 10) / 100;
        const vipAngle = 2 * Math.PI * vipPct;
        const remainingAngle = (2 * Math.PI - vipAngle) / (slices - 1);

        for (let i = 0; i < slices; i++) {
          const startR = hasHole ? innerR : 0;
          ctx.beginPath();
          ctx.moveTo(startR * Math.cos(currentAngle), startR * Math.sin(currentAngle));
          ctx.lineTo(r * Math.cos(currentAngle), r * Math.sin(currentAngle));
          ctx.stroke();

          if (showDegrees) drawAngleTag(currentAngle, r);
          currentAngle += (i === 0) ? vipAngle : remainingAngle;
        }
      } else {
        const angleStep = (2 * Math.PI) / slices;
        for (let i = 0; i < slices; i++) {
          const angle = i * angleStep - (Math.PI / 2);
          const startR = hasHole ? innerR : 0;
          ctx.beginPath();
          ctx.moveTo(startR * Math.cos(angle), startR * Math.sin(angle));
          ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
          ctx.stroke();

          if (showDegrees) drawAngleTag(angle, r);
        }
      }
    } else if (currentMode === 'grid') {
      // Grid Personalitzat
      const rows = parseInt(document.getElementById('grid-rows').value, 10) || 1;
      const cols = parseInt(document.getElementById('grid-cols').value, 10) || 1;
      drawGrid(r, rows, cols);
    } else if (currentMode === 'rect') {
      // Mode Rectangle Intel·ligent (Grid segons nombre de porcions)
      let rows = 1;
      let cols = slices;

      if (slices === 4) { rows = 2; cols = 2; }
      else if (slices === 6) { rows = 2; cols = 3; }
      else if (slices === 8) { rows = 2; cols = 4; }
      else if (slices === 9) { rows = 3; cols = 3; }
      else if (slices === 10) { rows = 2; cols = 5; }
      else if (slices === 12) { rows = 3; cols = 4; }
      else if (slices === 15) { rows = 3; cols = 5; }
      else if (slices === 16) { rows = 4; cols = 4; }

      drawGrid(r, rows, cols);
    }

    ctx.restore();
  }

  // Dibuixa retícules de forma neta
  function drawGrid(r, rows, cols) {
    const width = r * guide.aspectRatio;
    const left = -width;
    const top = -r;
    const wTotal = width * 2;
    const hTotal = r * 2;

    const stepX = wTotal / cols;
    for (let i = 1; i < cols; i++) {
      ctx.beginPath();
      ctx.moveTo(left + i * stepX, top);
      ctx.lineTo(left + i * stepX, top + hTotal);
      ctx.stroke();
    }

    const stepY = hTotal / rows;
    for (let j = 1; j < rows; j++) {
      ctx.beginPath();
      ctx.moveTo(left, top + j * stepY);
      ctx.lineTo(left + wTotal, top + j * stepY);
      ctx.stroke();
    }
  }

  // Dibuixa marques visuals de graus (Només quan està activat)
  function drawAngleTag(angleRad, radius) {
    ctx.save();
    let deg = Math.round(((angleRad + Math.PI / 2) * 180 / Math.PI) % 360);
    if (deg < 0) deg += 360;

    const tagRadius = radius + 12;
    const x = tagRadius * Math.cos(angleRad);
    const y = tagRadius * Math.sin(angleRad);

    ctx.font = 'bold 9px -apple-system, sans-serif';
    ctx.fillStyle = lineColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${deg}°`, x, y);
    ctx.restore();
  }

  resizeCanvas();
  startCamera();
  updateAngleInfo();
</script>
